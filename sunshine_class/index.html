<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>阳光分班</title>
<style>
  html, body { margin:0; height:100%; background:#bfeef8; overflow:hidden;
    font-family:"PingFang SC","Microsoft YaHei","Hiragino Sans GB","Noto Sans CJK SC",sans-serif; }
  #screen { display:block; width:100vw; height:100vh; }
  #tip { position:fixed; z-index:3; pointer-events:none; display:none;
    background:rgba(11,58,86,.94); color:#fff; font-size:13px; line-height:1.5;
    padding:6px 10px; border-radius:6px; white-space:nowrap; transform:translate(-50%,-130%);
    box-shadow:0 6px 18px rgba(0,0,0,.25); }
  #hint { position:fixed; left:50%; bottom:14px; transform:translateX(-50%); z-index:2;
    font-size:13px; color:#2d6f8e; background:rgba(255,255,255,.72); padding:6px 14px;
    border-radius:999px; letter-spacing:.5px; user-select:none; }
</style>
</head>
<body>
<canvas id="screen"></canvas>
<div id="tip"></div>
<div id="hint">空格 开始 / 重放 &nbsp;·&nbsp; R 重新随机分班 &nbsp;·&nbsp; E 导出名单 &nbsp;·&nbsp; F 全屏</div>
<script>
/* ---------- 大屏虚拟坐标系，等比缩放到任意屏幕 ---------- */
const W = 1920, H = 1080;
const cv = document.getElementById('screen'), ctx = cv.getContext('2d');
const tip = document.getElementById('tip');
let view = { s: 1, ox: 0, oy: 0 };

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = window.innerWidth, h = window.innerHeight;
  cv.width = w * dpr; cv.height = h * dpr;
  cv.style.width = w + 'px'; cv.style.height = h + 'px';
  view.s = Math.min(w / W, h / H);
  view.ox = (w - W * view.s) / 2; view.oy = (h - H * view.s) / 2;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
addEventListener('resize', resize); resize();

/* ---------- 主题色（对着视频取的） ---------- */
const C = {
  bg:      '#bfeef8',
  title:   '#123c5e',
  sub:     '#4b7f99',
  card:    '#ffffff',
  cardEdge:'#a8e2f2',
  cardHead:'#1d5madd',
  boy:     '#22b5f0',
  boyEdge: '#0f9ad4',
  girl:    '#ffffff',
  girlEdge:'#f2799f',
  girlText:'#e8558a',
  badge:   '#19c37d',
};
C.cardHead = '#1d5b7c';

/* ---------- 布局 ---------- */
const L = {
  cols: 5, rows: 3,
  padX: 34, top: 176, bottom: 26, gap: 16,
  chipCols: 10, chipGapX: 4, chipGapY: 4, chipPadX: 12, chipHeadH: 34,
};
let cards = [];      // 每个班的矩形与格子
let chips = [];      // 每个学生一个方块
let data = null;

function layout() {
  const cw = (W - L.padX * 2 - L.gap * (L.cols - 1)) / L.cols;
  const ch = (H - L.top - L.bottom - L.gap * (L.rows - 1)) / L.rows;
  cards = data.classes.map((cls, i) => {
    const cx = L.padX + (i % L.cols) * (cw + L.gap);
    const cy = L.top + Math.floor(i / L.cols) * (ch + L.gap);
    const inW = cw - L.chipPadX * 2;
    const chipW = (inW - L.chipGapX * (L.chipCols - 1)) / L.chipCols;
    const rows = Math.ceil(cls.count / L.chipCols);
    const availH = ch - L.chipHeadH - 12;
    const chipH = Math.min(chipW * 0.62, (availH - L.chipGapY * (rows - 1)) / rows);
    const gridH = rows * chipH + (rows - 1) * L.chipGapY;
    const y0 = cy + L.chipHeadH + (availH - gridH) / 2;
    return { cls, x: cx, y: cy, w: cw, h: ch, chipW, chipH, x0: cx + L.chipPadX, y0 };
  });

  chips = [];
  cards.forEach((card, ci) => {
    card.cls.students.forEach((st, si) => {
      const r = Math.floor(si / L.chipCols), c = si % L.chipCols;
      chips.push({
        st, ci, si,
        tx: card.x0 + c * (card.chipW + L.chipGapX),
        ty: card.y0 + r * (card.chipH + L.chipGapY),
        w: card.chipW, h: card.chipH,
        a: Math.random() * Math.PI * 2,          // 聚集态极角
        rr: Math.sqrt(Math.random()),            // 聚集态极径（均匀铺满圆盘）
        spin: 0.6 + Math.random() * 0.9,
        x: 0, y: 0,
      });
    });
  });
  // 派发顺序打散，视觉上像"到处乱飞"而不是一行行刷
  const order = chips.map((_, i) => i);
  for (let i = order.length - 1; i > 0; i--) {
    const j = (Math.random() * (i + 1)) | 0; [order[i], order[j]] = [order[j], order[i]];
  }
  order.forEach((idx, k) => { chips[idx].order = k / chips.length; });
}

/* ---------- 动画状态机 ---------- */
const T = { shuffle: 3600, deal: 4600, chip: 1200 };
let phase = 'idle', t0 = 0, now = 0, rounds = 0, roundsTarget = 0;

function start() {
  if (!data) return;
  phase = 'shuffle'; t0 = performance.now();
  rounds = 0; roundsTarget = 1800 + ((Math.random() * 900) | 0);
}
function ease(t) { return t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; }
function easeOut(t) { return 1 - Math.pow(1 - t, 3); }

function clusterPos(chip, tms) {
  const R = 218, cx = W / 2, cy = L.top + (H - L.top - L.bottom) / 2;
  const breathe = 1 + 0.06 * Math.sin(tms / 420 + chip.a * 3);
  const ang = chip.a + tms / 900 * chip.spin;
  const rad = chip.rr * R * breathe;
  return {
    x: cx + Math.cos(ang) * rad * 1.15 - chip.w / 2,
    y: cy + Math.sin(ang) * rad * 0.92 - chip.h / 2,
  };
}

/* ---------- 绘制小工具 ---------- */
function rr(x, y, w, h, r) {
  ctx.beginPath();
  r = Math.min(r, w / 2, h / 2);
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function drawLogo(x, y, r) {
  ctx.save();
  ctx.fillStyle = '#1bbf7a';
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = '#fff'; ctx.lineWidth = r * 0.16; ctx.lineJoin = 'round';
  ctx.beginPath();                                  // 小房子图标
  ctx.moveTo(x - r * .48, y - r * .02);
  ctx.lineTo(x, y - r * .48);
  ctx.lineTo(x + r * .48, y - r * .02);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(x - r * .3, y - r * .05); ctx.lineTo(x - r * .3, y + r * .42);
  ctx.lineTo(x + r * .3, y + r * .42); ctx.lineTo(x + r * .3, y - r * .05);
  ctx.stroke();
  ctx.restore();
}

function drawHeader(tms) {
  ctx.textBaseline = 'middle';
  ctx.textAlign = 'center';
  ctx.fillStyle = C.title;
  ctx.font = '700 46px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.fillText(data.title, W / 2, 76);

  drawLogo(78, 76, 25);

  // 副标题：随机次数 + 当前阶段
  const stage = phase === 'idle' ? '待开始' : phase === 'shuffle' ? '随机中'
              : phase === 'deal' ? '派发中' : '分班完成';
  const shown = phase === 'idle' ? 0 : phase === 'shuffle'
      ? Math.floor(roundsTarget * Math.min(1, (tms - t0) / T.shuffle) ** .7)
      : roundsTarget;
  ctx.font = '400 20px "PingFang SC","Microsoft YaHei",sans-serif';
  const parts = [
    ['总人数 ', String(data.total)],
    ['随机次数 ', String(shown)],
    ['当前阶段 ', null],
  ];
  let tw = 0;
  parts.forEach(([a, b]) => { tw += ctx.measureText(a).width + (b ? ctx.measureText(b).width : 66) + 26; });
  let x = (W - tw) / 2;
  ctx.textAlign = 'left';
  parts.forEach(([label, val]) => {
    ctx.fillStyle = C.sub; ctx.fillText(label, x, 128); x += ctx.measureText(label).width;
    if (val !== null) {
      ctx.fillStyle = C.title;
      ctx.font = '700 20px "PingFang SC","Microsoft YaHei",sans-serif';
      ctx.fillText(val, x, 128); x += ctx.measureText(val).width + 26;
      ctx.font = '400 20px "PingFang SC","Microsoft YaHei",sans-serif';
    } else {
      const w = ctx.measureText(stage).width + 22;
      const blink = phase === 'shuffle' ? .72 + .28 * Math.sin(tms / 180) : 1;
      ctx.globalAlpha = blink;
      ctx.fillStyle = phase === 'done' ? '#1bbf7a' : '#ff9500';
      rr(x, 128 - 14, w, 28, 14); ctx.fill();
      ctx.globalAlpha = 1;
      ctx.fillStyle = '#fff'; ctx.textAlign = 'center';
      ctx.font = '500 17px "PingFang SC","Microsoft YaHei",sans-serif';
      ctx.fillText(stage, x + w / 2, 128);
      ctx.textAlign = 'left';
      ctx.font = '400 20px "PingFang SC","Microsoft YaHei",sans-serif';
      x += w + 26;
    }
  });
}

function drawCard(card, alpha, reveal) {
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.shadowColor = 'rgba(20,90,120,.10)'; ctx.shadowBlur = 10; ctx.shadowOffsetY = 2;
  ctx.fillStyle = C.card; rr(card.x, card.y, card.w, card.h, 10); ctx.fill();
  ctx.shadowColor = 'transparent';
  ctx.strokeStyle = C.cardEdge; ctx.lineWidth = 1; ctx.stroke();

  ctx.textBaseline = 'middle';
  ctx.textAlign = 'left';
  ctx.fillStyle = C.cardHead;
  ctx.font = '700 19px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.fillText(card.cls.name, card.x + 14, card.y + 21);

  if (reveal > 0) {
    ctx.globalAlpha = alpha * reveal;
    ctx.textAlign = 'right';
    ctx.font = '500 15px "PingFang SC","Microsoft YaHei",sans-serif';
    let x = card.x + card.w - 14;
    const male = `男${card.cls.male}`, female = `女${card.cls.female}`, cnt = `${card.cls.count}人`;
    ctx.fillStyle = C.boyEdge; ctx.fillText(male, x, card.y + 21); x -= ctx.measureText(male).width + 8;
    ctx.fillStyle = C.girlText; ctx.fillText(female, x, card.y + 21); x -= ctx.measureText(female).width + 10;
    ctx.fillStyle = '#5f8ba1'; ctx.fillText(cnt, x, card.y + 21);
  }
  ctx.restore();
}

function drawChip(ch, scale) {
  const w = ch.w * scale, h = ch.h * scale;
  const x = ch.x + (ch.w - w) / 2, y = ch.y + (ch.h - h) / 2;
  const boy = ch.st.gender === '男';
  rr(x, y, w, h, Math.min(4, h / 3));
  if (boy) {
    ctx.fillStyle = C.boy; ctx.fill();
    ctx.strokeStyle = C.boyEdge; ctx.lineWidth = 1; ctx.stroke();
  } else {
    ctx.fillStyle = C.girl; ctx.fill();
    ctx.strokeStyle = C.girlEdge; ctx.lineWidth = 1.3; ctx.stroke();
  }
  if (h >= 13) {                                   // 大屏够大时显示姓名首字
    ctx.fillStyle = boy ? 'rgba(255,255,255,.95)' : 'rgba(226,84,132,.95)';
    ctx.font = `500 ${Math.floor(h * .72)}px "PingFang SC","Microsoft YaHei",sans-serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(ch.st.name.slice(0, 3), x + w / 2, y + h / 2 + .5, w - 3);
  }
}

/* ---------- 主循环 ---------- */
function frame(tms) {
  now = tms;
  ctx.save();
  ctx.setTransform(cv.width / (window.innerWidth || 1), 0, 0, cv.height / (window.innerHeight || 1), 0, 0);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  const dpr = cv.width / window.innerWidth;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = C.bg;
  ctx.fillRect(0, 0, window.innerWidth, window.innerHeight);
  ctx.translate(view.ox, view.oy); ctx.scale(view.s, view.s);
  ctx.fillStyle = C.bg; ctx.fillRect(0, 0, W, H);

  if (data) {
    const el = tms - t0;
    if (phase === 'shuffle' && el > T.shuffle) { phase = 'deal'; t0 = tms; }
    if (phase === 'deal' && el > T.deal + T.chip) { phase = 'done'; t0 = tms; }

    let cardAlpha = 0, reveal = 0;
    if (phase === 'deal') { cardAlpha = Math.min(1, el / 600); reveal = Math.max(0, Math.min(1, (el - T.deal * .55) / 900)); }
    else if (phase === 'done') { cardAlpha = 1; reveal = 1; }

    if (cardAlpha > 0) cards.forEach(c => drawCard(c, cardAlpha, reveal));

    for (const ch of chips) {
      let scale = 1;
      if (phase === 'idle' || phase === 'shuffle') {
        const p = clusterPos(ch, tms); ch.x = p.x; ch.y = p.y;
        if (phase === 'idle') scale = 1;
      } else if (phase === 'deal') {
        const st = ch.order * T.deal;
        const k = Math.max(0, Math.min(1, (el - st) / T.chip));
        const from = clusterPos(ch, t0 + st);
        const e = ease(k);
        // 带一点抛物线弧度，像"飞过去"
        const arc = Math.sin(Math.PI * k) * (ch.tx < W / 2 ? -1 : 1) * 26;
        ch.x = from.x + (ch.tx - from.x) * e + arc * (1 - Math.abs(.5 - k) * 2) * .3;
        ch.y = from.y + (ch.ty - from.y) * e - Math.sin(Math.PI * k) * 34;
        scale = k === 0 ? 1 : 0.9 + 0.1 * k + (k > .92 ? (1 - k) * 1.6 : 0);
      } else {
        ch.x = ch.tx; ch.y = ch.ty;
        const pop = Math.max(0, 1 - (tms - t0 - ch.order * 260) / 420);
        scale = 1 + 0.22 * Math.max(0, Math.min(1, pop)) * (tms - t0 < 900 ? 1 : 0);
      }
      drawChip(ch, scale);
    }
    drawHeader(tms);

    if (phase === 'idle') {
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillStyle = 'rgba(18,60,94,.55)';
      ctx.font = '500 24px "PingFang SC","Microsoft YaHei",sans-serif';
      ctx.fillText('按空格键开始分班', W / 2, H - 74);
    }
  } else {
    ctx.fillStyle = C.title; ctx.textAlign = 'center';
    ctx.font = '400 26px sans-serif'; ctx.fillText('名单加载中…', W / 2, H / 2);
  }
  ctx.restore();
  requestAnimationFrame(frame);
}

/* ---------- 交互 ---------- */
cv.addEventListener('mousemove', e => {
  if (phase !== 'done') { tip.style.display = 'none'; return; }
  const x = (e.clientX - view.ox) / view.s, y = (e.clientY - view.oy) / view.s;
  const hit = chips.find(c => x >= c.tx && x <= c.tx + c.w && y >= c.ty && y <= c.ty + c.h);
  if (!hit) { tip.style.display = 'none'; return; }
  tip.style.display = 'block';
  tip.style.left = e.clientX + 'px'; tip.style.top = e.clientY + 'px';
  tip.textContent = `${data.classes[hit.ci].name} · ${hit.st.name} · ${hit.st.gender} · ${hit.st.no}`;
});
cv.addEventListener('mouseleave', () => tip.style.display = 'none');

async function loadData(reshuffle) {
  const res = await fetch(reshuffle ? '/api/reshuffle' : '/api/data');
  data = await res.json();
  layout();
  phase = 'idle';
}
addEventListener('keydown', async e => {
  const k = e.key.toLowerCase();
  if (k === ' ' || e.code === 'Space') { e.preventDefault(); start(); }
  else if (k === 'r') { await loadData(true); start(); }
  else if (k === 'e') { location.href = '/api/export'; }
  else if (k === 'f') { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen(); }
});
cv.addEventListener('click', () => { if (phase === 'idle' || phase === 'done') start(); });

loadData(false).then(() => requestAnimationFrame(frame));
</script>
</body>
</html>
